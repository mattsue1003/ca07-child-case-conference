<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>短影音動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#FFF8EE}
#v{width:540px;height:960px;display:block}
#pick{position:fixed;top:4px;left:560px;font:14px sans-serif}
</style>
</head>
<body>
<svg id="v" viewBox="0 0 270 480" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const FONT="'LXGW WenKai TC','PingFang TC','Noto Sans TC',sans-serif";
const C={bg:'#FFF8EE',ink:'#4A3426',muted:'#9A8573',terra:'#D9734E',honey:'#EDB45A',sage:'#7FA88B',rose:'#E8A598',teal:'#5E9C98',cream:'#F6E7CF',white:'#FFFDF8',skin:'#F6CFAE',hair:'#5A3E2E',kidShirt:'#EDB45A',kidPants:'#7FA88B',dadShirt:'#5E9C98',dadPants:'#5A4636'};
const R=v=>(+v).toFixed(1);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sg=(t,a,b)=>cl((t-a)/(b-a));
const ez=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const bk=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const lp=(p,q,k)=>({x:lerp(p.x,q.x,k),y:lerp(p.y,q.y,k)});
const D=Math.PI/180;

function T(x,y,s,o={}){return `<text x="${R(x)}" y="${R(y)}" font-size="${o.size||16}" fill="${o.c||C.ink}" text-anchor="${o.a||'middle'}" font-weight="${o.w||700}" opacity="${o.op==null?1:o.op}" font-family="${FONT}">${s}</text>`}
function rect(x,y,w,h,r,fill,o=''){return `<rect x="${R(x)}" y="${R(y)}" width="${R(w)}" height="${R(h)}" rx="${r}" fill="${fill}" ${o}/>`}
function circ(x,y,r,fill,o=''){return `<circle cx="${R(x)}" cy="${R(y)}" r="${R(Math.max(0,r))}" fill="${fill}" ${o}/>`}
function ln(a,b,w,c,o=''){return `<line x1="${R(a.x)}" y1="${R(a.y)}" x2="${R(b.x)}" y2="${R(b.y)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${o}/>`}
function poly(pts,w,c,op=1){return `<polyline points="${pts.map(p=>R(p.x)+','+R(p.y)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`}
function pop(t,a){return bk(sg(t,a,a+.45))}
function grp(inner,{x=0,y=0,s=1,op=1,rot=0,ox=0,oy=0}={}){return `<g opacity="${R(op)}" transform="translate(${R(x)} ${R(y)}) translate(${R(ox)} ${R(oy)}) rotate(${R(rot)}) scale(${R(s)}) translate(${R(-ox)} ${R(-oy)})">${inner}</g>`}

function bgx(v=0){
  const b=[[ [40,70,60,C.rose],[240,170,70,C.sage],[60,330,80,C.honey] ],[ [230,80,70,C.honey],[30,220,60,C.sage],[220,360,70,C.rose] ]][v%2];
  return rect(0,0,270,480,0,C.bg)+b.map(q=>circ(q[0],q[1],q[2],q[3],'opacity=".16"')).join('');
}
function head(title,t){
  const k=sg(t,0,.5);
  return T(135,58,title,{size:21,op:k})+`<path d="M${R(135-70*k)} 68 q 18 6 35 0 t 35 0 t 35 0 t 35 0" fill="none" stroke="${C.honey}" stroke-width="3" stroke-linecap="round" opacity="${R(k*.9)}" transform="translate(${R(70*(1-k))} 0)"/>`;
}
function cap(lines,op=1){
  if(typeof lines==='string')lines=[lines];
  const h=lines.length>1?62:42,y=446-h;
  let s=rect(16,y,238,h,18,C.white,`stroke="${C.cream}" stroke-width="2" opacity="${op}"`);
  lines.forEach((l,i)=>s+=T(135,y+(lines.length>1?26+i*23:27),l,{size:i?14:16.5,c:i?C.muted:C.ink,w:i?400:700,op}));
  return s;
}
function pill(x,y,txt,col,k=1,size=15){
  const w=txt.length*size*0.95+26;
  return grp(rect(x-w/2,y-17,w,34,17,col)+T(x,y+5.5,txt,{size,c:'#fff'}),{s:k,ox:x,oy:y,op:cl(k*1.5)});
}

/* ---------- figure ---------- */
function ik(a,b,l1,l2,side){
  let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  d=Math.min(Math.max(d,Math.abs(l1-l2)+.01),l1+l2-.01);
  const an=Math.atan2(dy,dx),c=(l1*l1+d*d-l2*l2)/(2*l1*d),al=Math.acos(cl(c,-1,1));
  return [{x:a.x+l1*Math.cos(an+side*al),y:a.y+l1*Math.sin(an+side*al)},{x:a.x+d*Math.cos(an),y:a.y+d*Math.sin(an)}];
}
function fig(o){
  const s=o.s||1,L={t:30*s,ua:16*s,fa:15*s,th:19*s,sh:19*s,hr:13*s};
  const shirt=o.shirt||C.kidShirt,pants=o.pants||C.kidPants,lw=8.5*s;
  const hip=o.hip,ta=(o.ta||0)*D,u={x:Math.sin(ta),y:-Math.cos(ta)};
  const sho={x:hip.x+u.x*L.t,y:hip.y+u.y*L.t};
  const ha=ta+(o.ha||0)*D,neck={x:sho.x+u.x*2*s,y:sho.y+u.y*2*s};
  const hc={x:neck.x+Math.sin(ha)*L.hr,y:neck.y-Math.cos(ha)*L.hr};
  const fN=o.fN||{x:hip.x+3*s,y:hip.y+L.th+L.sh-.5},fF=o.fF||{x:hip.x-3*s,y:hip.y+L.th+L.sh-.5};
  const [kN,eN]=ik(hip,fN,L.th,L.sh,-1),[kF,eF]=ik(hip,fF,L.th,L.sh,-1);
  const hang={x:sho.x+3*s,y:sho.y+L.ua+L.fa};
  const hN=o.hN||hang,hF=o.hF||{x:hang.x-5*s,y:hang.y};
  const [elN,wN]=ik(sho,hN,L.ua,L.fa,1),[elF,wF]=ik(sho,hF,L.ua,L.fa,1);
  const shoe=p=>`<ellipse cx="${R(p.x+2.5*s)}" cy="${R(p.y)}" rx="${R(5.5*s)}" ry="${R(3.2*s)}" fill="${C.ink}"/>`;
  let g='';
  g+=poly([hip,kF,eF],lw,pants,.55)+shoe(eF);
  g+=poly([sho,elF,wF],lw*.85,shirt,.55)+circ(wF.x,wF.y,3.6*s,C.skin,'opacity=".8"');
  g+=ln(hip,sho,16*s,shirt)+circ(hip.x,hip.y,8.5*s,pants);
  g+=poly([hip,kN,eN],lw,pants)+shoe(eN);
  g+=circ(hc.x-2.5*s,hc.y-2.5*s,L.hr,o.hair||C.hair);
  g+=circ(hc.x+1*s,hc.y+.8*s,L.hr*.93,C.skin);
  g+=circ(hc.x-4*s,hc.y-7*s,L.hr*.62,o.hair||C.hair);
  if(o.eyes!=='closed')g+=circ(hc.x+L.hr*.5,hc.y-1*s,1.7*s,C.ink);
  else g+=ln({x:hc.x+L.hr*.35,y:hc.y-1*s},{x:hc.x+L.hr*.65,y:hc.y-1*s},1.4*s,C.ink);
  g+=circ(hc.x+L.hr*.32,hc.y+L.hr*.38,2.6*s,C.rose,'opacity=".75"');
  if(o.mouth)g+=`<ellipse cx="${R(hc.x+L.hr*.78)}" cy="${R(hc.y+L.hr*.42)}" rx="${R(1.8*s)}" ry="${R(o.mouth*s)}" fill="${C.ink}"/>`;
  const arm=poly([sho,elN,wN],lw*.85,shirt)+circ(wN.x,wN.y,3.8*s,C.skin);
  return {g,arm,all:g+arm,hip,sho,hc,kN,eN,elN,wN,L};
}
function walk(hx,ground,ph,s=1,stride=8){
  const f=a=>({x:hx+stride*s*Math.sin(a),y:ground-5*s*Math.max(0,Math.cos(a))});
  return {hip:{x:hx,y:ground-37*s-1.2*s*Math.abs(Math.cos(ph))},fN:f(ph),fF:f(ph+Math.PI)};
}
function ground(y,t,speed=0){
  let s=ln({x:10,y},{x:260,y},3,C.cream);
  if(speed){const off=(t*speed)%26;for(let x=10-off;x<260;x+=26)if(x>10)s+=ln({x,y:y+8},{x:x+9,y:y+8},2.5,C.cream);}
  return s;
}
function arc(cx,cy,r,h1,h2){
  const a1=(h1/24)*2*Math.PI-Math.PI/2,a2=(h2/24)*2*Math.PI-Math.PI/2;
  const p1={x:cx+r*Math.cos(a1),y:cy+r*Math.sin(a1)},p2={x:cx+r*Math.cos(a2),y:cy+r*Math.sin(a2)};
  return `M${R(p1.x)} ${R(p1.y)} A${r} ${r} 0 ${(h2-h1)>12?1:0} 1 ${R(p2.x)} ${R(p2.y)}`;
}

/* ---------- clips ---------- */
const CLIPS={
cover:{L:6,draw(t){
  let s=bgx(0)+circ(135,260,92,C.honey,'opacity=".22"');
  const bob=Math.sin(t*2.4)*1.2;
  const k=fig({hip:{x:135,y:300+bob},fN:{x:139,y:338},fF:{x:131,y:338},hN:{x:146,y:322+bob}});
  s+=ground(340,t)+k.all;
  s+=pill(80,118,'8 歲',C.terra,pop(t,.5));
  s+=pill(190,150,'自閉症',C.teal,pop(t,1.1));
  s+=pill(86,190,'墜落多處骨折',C.sage,pop(t,1.7),14);
  s+=T(135,58,'小 A 的居家復能',{size:23,op:sg(t,0,.5)});
  s+=cap(['一個 8 歲孩子，和他的家','線上個案研討'],sg(t,2.3,2.9));
  return s;}},

fracture:{L:7,draw(t){
  let s=bgx(1)+head('傷後的身體',t)+ground(368,t);
  const k=fig({hip:{x:92,y:331},fN:{x:96,y:367},fF:{x:88,y:367},hN:{x:112,y:356},hF:{x:104,y:358}});
  s+=k.all;
  const pts=[[lp(k.sho,k.elN,.3),'肱骨近端'],[lp(k.sho,k.elN,.85),'肱骨遠端'],[k.elN,'尺骨鷹嘴突'],[lp(k.elN,k.wN,.8),'橈骨遠端'],[lp(k.hip,k.kN,.55),'左股骨幹'],[lp(k.sho,k.hc,.42),'第二頸椎']];
  pts.forEach(([p,l],i)=>{
    const a=.5+i*.65,kk=sg(t,a,a+.3);if(!kk)return;
    const ly=112+i*36,pulse=(t-a)%1.4/1.4;
    s+=circ(p.x,p.y,6+pulse*9,C.terra,`opacity="${R(.35*(1-pulse))}"`)+circ(p.x,p.y,5,C.terra,`stroke="#fff" stroke-width="1.5"`);
    s+=`<path d="M${R(p.x+5)} ${R(p.y)} C ${R(p.x+30)} ${R(p.y)}, 140 ${ly}, 158 ${ly}" fill="none" stroke="${C.terra}" stroke-width="1.4" stroke-dasharray="3 3" opacity="${R(kk*.8)}"/>`;
    s+=rect(160,ly-13,96,26,13,C.white,`stroke="${C.rose}" stroke-width="1.5" opacity="${R(kk)}"`)+T(208,ly+5,l,{size:13.5,op:kk});
  });
  s+=t<5?cap(['雙手多處、左大腿、頸椎骨折','114 年 11 月自家中高處墜落'],sg(t,.3,.8)):cap(['石膏已拆','目前約每週回醫院復健 1 次'],1);
  return s;}},

timeline:{L:8,draw(t){
  let s=bgx(0)+head('從急診到居家',t);
  const items=[['114/11','墜落、急診、多處手術'],['114/11','出院準備評估・CMS 8 級'],['115/01 前後','石膏移除，每週回醫院復健'],['115/02','複評，CMS 降為 6 級'],['115/02 底','居家復能目標區間開始'],['115/03','職能治療到宅 2 次']];
  const y0=104,st=50;
  s+=ln({x:48,y:y0},{x:48,y:y0+(st*5)*ez(sg(t,.2,5.2))},4,C.cream);
  items.forEach(([d,w],i)=>{
    const a=.3+i*.85,k=pop(t,a);if(!k)return;const y=y0+i*st,gap=i===2;
    s+=gap?circ(48,y,9,C.white,`stroke="${C.terra}" stroke-width="2.5" stroke-dasharray="3 2.5" transform="rotate(${R(t*40)} 48 ${y})"`):circ(48,y,8*k,C.sage,`stroke="#fff" stroke-width="2.5"`);
    s+=T(68,y-2,d,{a:'start',size:15,c:gap?C.terra:C.ink,op:cl(k)})+T(68,y+17,w,{a:'start',size:13,w:400,c:gap?C.terra:C.muted,op:cl(k)});
  });
  s+=t<5.8?cap('傷後 4 個月的路',sg(t,.2,.7)):cap(['醫院每週 1 次','居家每天練，才是關鍵'],1);
  return s;}},

clock:{L:9,draw(t){
  let s=bgx(1)+head('爸爸的一天',t);
  const cx=135,cy=214,h=(6+t/9*24)%24,k=sg(t,0,.8);
  s+=circ(cx,cy,80,'none',`stroke="${C.cream}" stroke-width="22"`)+circ(cx,cy,56,C.white);
  const seg=(r,a,b,c,w,op=1)=>`<path d="${arc(cx,cy,r,a,b)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" opacity="${op*k}"/>`;
  s+=seg(80,8,16,C.sage,20)+seg(80,16,18.8,C.honey,20)+seg(101,18,23.8,C.teal,8);
  s+=seg(64,22,26,C.rose,7,.55+.45*Math.sin(t*5));
  [[0,'0'],[6,'6'],[12,'12'],[18,'18']].forEach(([hh,l])=>{const a=hh/24*2*Math.PI-Math.PI/2;s+=T(cx+118*Math.cos(a)*(hh%12?1:.96),cy+118*Math.sin(a)*(hh%12?1:.96)+5,l,{size:12,c:C.muted,w:400});});
  const a=h/24*2*Math.PI-Math.PI/2;
  s+=ln({x:cx,y:cy},{x:cx+46*Math.cos(a),y:cy+46*Math.sin(a)},4,C.ink)+circ(cx,cy,5,C.terra);
  s+=T(cx,cy+30,String(Math.floor(h)).padStart(2,'0')+':00',{size:15,c:C.muted});
  const lg=[[C.sage,'上學'],[C.honey,'阿嬤照看'],[C.teal,'爸爸外送'],[C.rose,'夜裡哭鬧']];
  lg.forEach(([c,l],i)=>{const x=62+(i%2)*92,y=338+Math.floor(i/2)*20;s+=circ(x,y,5,c)+T(x+10,y+4.5,l,{a:'start',size:12.5,w:400,c:C.muted});});
  let c1;
  if(h>=8&&h<16)c1=['上學（特教班）','']; else if(h>=16&&h<18.8)c1=['阿嬤接放學、照看','等爸爸下班']; else if(h>=18.8&&h<22)c1=['爸爸晚上出門外送','為了照顧，減少了工時']; else if(h>=22||h<2)c1=['每週 1–2 天','哭鬧到凌晨 1–2 點']; else c1=['爸爸也要睡、也要上班',''];
  s+=cap(c1[1]?c1:c1[0]);
  return s;}},

voice:{L:6,draw(t){
  let s=bgx(0)+head('他怎麼告訴我們',t);
  const cx=135,cy=228,r=56,ph=t<2.2?0:t<4.2?1:2;
  s+=circ(cx-8,cy-8,r,C.hair)+circ(cx+3,cy+2,r*.93,C.skin)+circ(cx-14,cy-30,r*.6,C.hair);
  s+=circ(cx-14,cy+2,4,C.ink)+circ(cx+26,cy+2,4,C.ink)+circ(cx-24,cy+22,7,C.rose,'opacity=".7"')+circ(cx+36,cy+22,7,C.rose,'opacity=".7"');
  if(ph===1){const m=4+5*Math.abs(Math.sin(t*9));s+=`<ellipse cx="${cx+6}" cy="${cy+30}" rx="9" ry="${R(m)}" fill="${C.ink}"/>`;
    for(let i=0;i<3;i++){const q=((t-2.2)*1.3+i/3)%1;s+=`<path d="${arc(cx+30,cy+30,22+q*40,2.2,3.8)}" fill="none" stroke="${C.honey}" stroke-width="4" stroke-linecap="round" opacity="${R(1-q)}"/>`;}
    s+=T(212,148,'啊──',{size:24,c:C.terra,op:sg(t,2.3,2.6)});}
  else s+=`<path d="M${cx-4} ${cy+30} q 10 4 20 0" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if(ph===0){const k=pop(t,.3);s+=grp(rect(18,96,120,40,16,C.white,`stroke="${C.cream}" stroke-width="2"`)+T(78,122,'要喝水嗎？',{size:15}),{s:k,ox:78,oy:116});
    s+=grp(rect(176,138,60,32,14,C.cream)+T(206,160,'…',{size:18}),{s:pop(t,1.1),ox:206,oy:154});}
  if(ph===2)['表情','喊叫','閃躲'].forEach((l,i)=>s+=pill(70+i*65,340,l,[C.sage,C.terra,C.teal][i],pop(t,4.3+i*.25)));
  s+=cap([['沒有口語','問了，也很難回答'],['不舒服時','只能用喊叫表達'],['看表情、聽聲音、看動作','來調整治療的強度']][ph]);
  return s;}},

adl:{L:7,draw(t){
  let s=bgx(1)+head('巴氏量表',t);
  const it=[['吃飯',0,10],['洗澡',0,5],['修飾',0,5],['穿衣',5,10],['大便',0,10],['小便',0,10],['如廁',0,10],['移位',15,15],['走路',15,15],['樓梯',0,10]];
  let tot=0;
  it.forEach(([l,v,m],i)=>{const y=98+i*28,k=ez(sg(t,.3+i*.18,1.1+i*.18));
    s+=T(48,y+5,l,{a:'end',size:14,w:400})+rect(58,y-7,160,14,7,C.cream);
    if(v)s+=rect(58,y-7,160*v/m*k,14,7,v===m?C.sage:C.honey);
    else s+=T(64,y+4,'需協助',{a:'start',size:10,w:400,c:C.muted,op:k});
    s+=T(224,y+5,v+'/'+m,{a:'start',size:11.5,w:400,c:C.muted});tot+=v*k;});
  s+=cap(['總分 '+Math.round(tot)+' / 100','會走了，雙手還幫不上忙']);
  return s;}},

risk:{L:8,draw(t){
  let s=bgx(0)+head('四個風險訊號',t);
  const it=[['肘・腕','關節受限、手沒力',C.terra],['14.5','BMI 偏低，常吃不完',C.honey],['嗆咳','不常見，已改善',C.rose],['不穩','移位走路怕跌倒',C.teal]];
  it.forEach(([a,b,c],i)=>{const k=bk(sg(t,.3+i*1,.9+i*1)),y=92+i*74;
    s+=grp(rect(20,y,230,62,18,C.white,`stroke="${C.cream}" stroke-width="2"`)+rect(20,y,10,62,5,c)+T(78,y+40,a,{size:23,c})+T(190,y+37,b,{size:13.5,w:400}),{x:(1-k)*260,op:cl(k*2)});});
  s+=t<5?cap('身體功能與健康'):cap(['要一起看','不只是動作的問題']);
  return s;}},

stairs:{L:8,draw(t){
  let s=bgx(1)+head('回家的 3 層樓',t);
  const x0=20,y0=388,dx=23,dy=25,n=10;
  const sy=x=>{const i=Math.floor((x-x0)/dx);return i<0?y0:y0-(Math.min(i,n-1)+1)*dy};
  let d=`M${x0} ${y0+20} L${x0} ${y0}`;for(let i=0;i<n;i++)d+=` L${x0+i*dx} ${y0-(i+1)*dy} L${x0+(i+1)*dx} ${y0-(i+1)*dy}`;d+=` L${x0+n*dx} ${y0+20} Z`;
  s+=`<path d="${d}" fill="${C.cream}" stroke="#E9D6B8" stroke-width="2" stroke-linejoin="round"/>`;
  s+=poly([{x:x0+10,y:y0-55},{x:x0+n*dx-5,y:y0-n*dy-50}],3,C.muted,.5);
  const p=ez(sg(t%8,.2,6.8)),hx=34+p*185,ph=p*2*Math.PI*6,sc=1.3;
  const fx=a=>hx+7*Math.sin(a),fN={x:fx(ph),y:sy(fx(ph))-4*Math.max(0,Math.cos(ph))},fF={x:fx(ph+Math.PI),y:sy(fx(ph+Math.PI))-4*Math.max(0,Math.cos(ph+Math.PI))};
  const hip={x:hx,y:Math.min(fN.y,fF.y)-37*sc*.92};

const v=document.getElementById('v');
window.CLIPS=Object.fromEntries(Object.entries(CLIPS).map(([k,c])=>[k,c.L]));
window.draw=(name,t)=>{v.innerHTML=CLIPS[name].draw(t);};
const q=new URLSearchParams(location.search),only=q.get('c');
if(!q.has('render')){
  const names=Object.keys(CLIPS);let cur=only||names[0],t0=performance.now();
  const sel=document.createElement('select');sel.id='pick';names.forEach(n=>sel.add(new Option(n,n)));sel.value=cur;sel.onchange=()=>{cur=sel.value;t0=performance.now()};document.body.appendChild(sel);
  (function loop(){const L=CLIPS[cur].L,t=((performance.now()-t0)/1000)%L;draw(cur,t);requestAnimationFrame(loop)})();
}
